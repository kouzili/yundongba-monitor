<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韵动吧 场地监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px/1.6 -apple-system,sans-serif;background:#f5f5f5;color:#333}
.header{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px;font-weight:500}
.status-bar{display:flex;gap:16px;font-size:12px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.on{background:#4caf50}.off{background:#e53935}
.container{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:370px 1fr;gap:16px}
.card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.card h3{font-size:13px;font-weight:500;margin-bottom:8px;color:#555;border-bottom:1px solid #eee;padding-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
label{font-size:12px;color:#666;min-width:50px}
input[type=text],input[type=number],input[type=date],input[type=password]{padding:5px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px}
input[type=number]{width:55px}
input.wide{flex:1;min-width:0}
.btn{padding:6px 14px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:500}
.btn:hover{opacity:.88}
.btn-primary{background:#1a73e8;color:#fff}
.btn-success{background:#0d904f;color:#fff}
.btn-danger{background:#e53935;color:#fff}
.btn-gray{background:#666;color:#fff;padding:4px 10px;font-size:11px}
.hint{font-size:11px;color:#999;margin-top:4px}
.warn-box{background:#fff4e5;border:1px solid #ffb74d;border-radius:6px;padding:9px;margin:6px 0;font-size:12px;color:#7a4b00}
.warn-box code{background:#fff;padding:1px 5px;border-radius:3px}
.set-yes{color:#0d904f}.set-no{color:#e53935}
.pri-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:5px;margin-bottom:5px;cursor:grab}
.pri-item.dragging{opacity:.4}
.pri-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pri-item .del{color:#e53935;cursor:pointer;font-size:14px}
.pri-num{background:#1a73e8;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:11px;flex-shrink:0}
.search-result{padding:5px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.search-result:hover{background:#f0f6ff}
.search-result .add{color:#1a73e8;flex-shrink:0}
#logPanel{height:520px;overflow-y:auto;background:#1e1e1e;color:#d4d4d4;font:12px Menlo,monospace;padding:10px;border-radius:4px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.log-find{color:#4caf50}.log-err{color:#e53935}.log-warn{color:#ff9800}
.result-item{font-size:12px;padding:4px 0;border-bottom:1px solid #f0f0f0}
.empty{color:#999;font-style:italic}
</style>
</head>
<body>
<div class="header">
  <h1>🎾 韵动吧 · 场地监控</h1>
  <div class="status-bar">
    <span>监控 <span class="dot" id="odot"></span><span id="otxt">停止</span></span>
  </div>
</div>

<div class="container">
<div>
  <!-- 凭证 -->
  <div class="card">
    <h3>🔑 凭证</h3>
    <div id="secretWarn"></div>
    <div class="row">
      <label>签名密钥</label>
      <input type="password" class="wide" id="secretApi" placeholder="留空则不修改">
      <span id="secretState"></span>
    </div>
    <div class="row">
      <label>飞书 URL</label>
      <input type="password" class="wide" id="feishuWebhook" placeholder="留空则不修改">
      <span id="webhookState"></span>
    </div>
    <div class="row">
      <label>飞书签名</label>
      <input type="password" class="wide" id="feishuSecret" placeholder="机器人未开签名校验则不用填">
      <span id="feishuSecretState"></span>
    </div>
    <div class="row">
      <label>session</label>
      <input type="password" class="wide" id="appsessionid" placeholder="通常不需要，留空">
      <span id="sessionState"></span>
    </div>
    <div class="row">
      <button class="btn btn-primary" onclick="saveSecrets(this)">💾 保存凭证</button>
      <button class="btn btn-gray" onclick="testNotify(this)">📨 测试推送</button>
    </div>
    <div id="secretResult" class="hint"></div>
  </div>

  <!-- 场地 -->
  <div class="card">
    <h3>📍 场地（拖拽排序）</h3>
    <div class="row">
      <input type="text" class="wide" id="searchKw" placeholder="搜索场地名，如：古北">
      <button class="btn btn-primary" onclick="searchStadium()">搜索</button>
    </div>
    <div id="searchResults"></div>
    <div id="priList" style="margin-top:8px"></div>
    <div class="hint">所有场地都会被查询，排序只决定日志与推送里的先后</div>
  </div>

  <!-- 日期 & 时段 & 控制 -->
  <div class="card">
    <h3>📅 日期 & 时段 & 控制</h3>
    <div class="row">
      <label>开始</label><input type="date" id="startDate">
      <label>结束</label><input type="date" id="endDate">
    </div>
    <div class="row">
      <label>时段</label>
      <input type="number" id="sh" min="0" max="23"> :00 -
      <input type="number" id="eh" min="1" max="24"> :00
    </div>
    <div class="row">
      <label>间隔</label><input type="number" id="iv" min="10" max="3600"> 秒
    </div>
    <div class="row">
      <button class="btn btn-primary" onclick="saveConfig(this)">💾 保存配置</button>
      <button class="btn btn-gray" onclick="testQuery(this)">🔍 查询一次</button>
    </div>
    <div id="testResult" style="margin-top:8px"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-success" onclick="monitorStart()" style="flex:1">▶ 开始监控</button>
      <button class="btn btn-danger" onclick="monitorStop()" style="flex:1">⏹ 停止监控</button>
    </div>
  </div>
</div>

<div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <h3 style="border:none;padding:0;margin:0">📋 运行日志</h3>
      <button class="btn btn-gray" onclick="clearLogs()">清空</button>
    </div>
    <div id="logPanel"></div>
  </div>
</div>
</div>

<script>
let cfg = {}, dragIdx = null, cfgLoaded = false;

// 场馆名来自远端接口，一律转义后再进 DOM
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function $(id){ return document.getElementById(id) }

async function api(u, m, b){
  const o = {method: m || 'GET', headers: {'Content-Type':'application/json'}};
  if(b) o.body = JSON.stringify(b);
  const r = await fetch(u, o);
  return r.json();
}

(async function init(){
  await refreshStatus();
  setInterval(async ()=>{ await refreshStatus(); await refreshLogs() }, 2000);
})();

function renderSetState(id, isSet){
  const el = $(id);
  el.className = isSet ? 'set-yes' : 'set-no';
  el.textContent = isSet ? '已设置' : '未设置';
}

async function refreshStatus(){
  const s = await api('/api/status');
  $('odot').className = 'dot ' + (s.monitor_running ? 'on' : 'off');
  $('otxt').textContent = s.monitor_running ? '运行中' : '停止';
  cfg = s.config;

  renderSetState('secretState', cfg.secret_api_set);
  renderSetState('webhookState', cfg.feishu_webhook_set);
  renderSetState('feishuSecretState', cfg.feishu_secret_set);
  renderSetState('sessionState', cfg.appsessionid_set);
  $('secretWarn').innerHTML = cfg.secret_api_set ? '' :
    '<div class="warn-box">还没有签名密钥，所有查询都会返回「签名错误」。<br>' +
    '先在这台机器上跑 <code>.venv/bin/python tools/get_secret.py</code></div>';

  // 只在首次填充，避免定时刷新覆盖没保存的修改
  if(!cfgLoaded){
    $('startDate').value = cfg.start_date || '';
    $('endDate').value = cfg.end_date || '';
    $('sh').value = cfg.target_start;
    $('eh').value = cfg.target_end;
    $('iv').value = cfg.poll_interval;
    cfgLoaded = true;
  }
  renderPriority();
}

function renderPriority(){
  const div = $('priList');
  const priority = cfg.stadium_priority || [];
  const stadiums = cfg.stadiums || {};
  if(!priority.length){ div.innerHTML = '<span class="empty">暂无场地，搜索添加</span>'; return }
  div.innerHTML = priority.map((sid, idx) => `
    <div class="pri-item" draggable="true" data-idx="${idx}">
      <span class="pri-num">${idx+1}</span>
      <span class="name">${esc(stadiums[sid] || sid)}</span>
      <span style="color:#999;font-size:10px">ID:${esc(sid)}</span>
      <span class="del" data-sid="${esc(sid)}" title="移除">✕</span>
    </div>`).join('');
}

// 事件委托：避免把远端字符串拼进 onclick
$('priList').addEventListener('dragstart', e => {
  const item = e.target.closest('.pri-item');
  if(item){ dragIdx = Number(item.dataset.idx); item.classList.add('dragging') }
});
$('priList').addEventListener('dragover', e => e.preventDefault());
$('priList').addEventListener('drop', async e => {
  e.preventDefault();
  const item = e.target.closest('.pri-item');
  if(!item || dragIdx === null) return;
  const priority = [...(cfg.stadium_priority || [])];
  const [moved] = priority.splice(dragIdx, 1);
  priority.splice(Number(item.dataset.idx), 0, moved);
  cfg.stadium_priority = priority;
  renderPriority();
  await api('/api/config', 'POST', {stadium_priority: priority});
});
$('priList').addEventListener('click', async e => {
  if(!e.target.classList.contains('del')) return;
  const sid = e.target.dataset.sid;
  const priority = (cfg.stadium_priority || []).filter(x => x !== sid);
  await api('/api/config', 'POST', {stadium_priority: priority});
  await refreshStatus();
});

async function searchStadium(){
  const kw = $('searchKw').value.trim();
  if(!kw) return;
  const r = await api('/api/search', 'POST', {keyword: kw});
  const div = $('searchResults');
  if(!r.ok){ div.innerHTML = `<div class="empty">${esc(r.msg || '搜索失败')}</div>`; return }
  if(!r.results.length){ div.innerHTML = '<div class="empty">无结果</div>'; return }
  div.innerHTML = r.results.map(s => `
    <div class="search-result" data-sid="${esc(s.stadiumid)}" data-name="${esc(s.name)}">
      <span>${esc(s.name)}</span><span class="add">+ 添加</span>
    </div>`).join('');
}

$('searchResults').addEventListener('click', async e => {
  const row = e.target.closest('.search-result');
  if(!row) return;
  const sid = row.dataset.sid, name = row.dataset.name;
  const stadiums = {...(cfg.stadiums || {})};
  stadiums[sid] = name;
  const priority = [...(cfg.stadium_priority || [])];
  if(!priority.includes(sid)) priority.push(sid);
  await api('/api/config', 'POST', {stadiums, stadium_priority: priority});
  $('searchResults').innerHTML = '';
  $('searchKw').value = '';
  await refreshStatus();
});

async function saveSecrets(btn){
  btn.disabled = true;
  // 空值表示「不修改」，后端会跳过
  await api('/api/config', 'POST', {
    secret_api: $('secretApi').value.trim(),
    feishu_webhook: $('feishuWebhook').value.trim(),
    feishu_secret: $('feishuSecret').value.trim(),
    appsessionid: $('appsessionid').value.trim(),
  });
  ['secretApi','feishuWebhook','feishuSecret','appsessionid'].forEach(id => $(id).value = '');
  $('secretResult').innerHTML = '<span class="set-yes">已保存</span>';
  btn.disabled = false;
  await refreshStatus();
}

async function testNotify(btn){
  btn.disabled = true; btn.textContent = '发送中…';
  const r = await api('/api/notify/test', 'POST');
  $('secretResult').innerHTML = r.ok
    ? '<span class="set-yes">✅ 推送成功，看下飞书</span>'
    : `<span class="set-no">❌ ${esc(r.msg)}</span>`;
  btn.disabled = false; btn.textContent = '📨 测试推送';
}

async function saveConfig(btn){
  btn.disabled = true;
  await api('/api/config', 'POST', {
    start_date: $('startDate').value,
    end_date: $('endDate').value,
    target_start: parseInt($('sh').value),
    target_end: parseInt($('eh').value),
    poll_interval: parseInt($('iv').value),
  });
  btn.disabled = false;
  await refreshStatus();
}

async function monitorStart(){ await api('/api/monitor/start','POST'); await refreshStatus() }
async function monitorStop(){ await api('/api/monitor/stop','POST'); await refreshStatus() }

async function testQuery(btn){
  btn.disabled = true; btn.textContent = '查询中…';
  const r = await api('/api/test', 'POST');
  const rows = [];
  (r.slots || []).forEach(s => rows.push(
    `<div class="result-item">🎾 ${esc(s.stadium)} ${esc(s.date)} ${esc(s.time)} · ${esc(s.field)} · ¥${esc(s.price)}</div>`));
  (r.misses || []).forEach(m => rows.push(
    `<div class="result-item">⚪ ${esc(m.stadium)} ${esc(m.date)} 全满 | 最近 ${esc(m.nearest.field)} ${esc(m.nearest.time)} ¥${esc(m.nearest.price)}</div>`));
  (r.failures || []).forEach(f => rows.push(
    `<div class="result-item">❌ ${esc(f.stadium)} ${esc(f.date)} ${esc(f.error)}</div>`));
  $('testResult').innerHTML = rows.length ? rows.join('') : '<span class="empty">目标时段无空场，也没有可比较的时段</span>';
  btn.disabled = false; btn.textContent = '🔍 查询一次';
}

async function refreshLogs(){
  const r = await api('/api/logs');
  const p = $('logPanel');
  if(!r.logs || !r.logs.length) return;
  p.innerHTML = r.logs.map(l => {
    let c = '';
    if(l.includes('🟢') || l.includes('🎾')) c = 'log-find';
    else if(l.includes('❌')) c = 'log-err';
    else if(l.includes('⚪') || l.includes('⚠️')) c = 'log-warn';
    return `<span class="${c}">${esc(l)}</span>`;
  }).join('\n');
  p.scrollTop = p.scrollHeight;
}
async function clearLogs(){ await api('/api/logs/clear','POST') }
</script>
</body>
</html>
